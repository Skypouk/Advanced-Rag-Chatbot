# ─────────────────────────────────────────────────────────────────────────────
#  RAG Chatbot – one-command local stack
#
#    docker-compose up --build
#
#  Frontend → http://localhost:5173
#  Backend  → http://localhost:8000  (OpenAPI docs at /docs)
#  Ollama   → http://localhost:11434
#
#  Values like ${OLLAMA_LLM_MODEL} are read from the shell or from the .env
#  file next to this compose file (see .env.example).
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ───────────────────────────── Ollama (LLM server) ─────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    # Start the server, wait until it answers, pull the required models
    # (a no-op when they are already in the ollama_data volume), then keep
    # the server process in the foreground.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        SERVER_PID=$$!
        echo "[ollama-init] waiting for ollama server..."
        until ollama list >/dev/null 2>&1; do sleep 1; done
        echo "[ollama-init] pulling $${OLLAMA_LLM_MODEL} and $${OLLAMA_EMBED_MODEL} (first run can take several minutes)"
        ollama pull "$${OLLAMA_LLM_MODEL}" || echo "[ollama-init] WARNING: failed to pull $${OLLAMA_LLM_MODEL}"
        ollama pull "$${OLLAMA_EMBED_MODEL}" || echo "[ollama-init] WARNING: failed to pull $${OLLAMA_EMBED_MODEL}"
        echo "[ollama-init] models ready"
        wait $$SERVER_PID
    # The official ollama image ships without curl, so a curl-based probe would
    # never pass. `ollama list` calls the same GET /api/tags endpoint, and the
    # grep makes the container report healthy only once both models are pulled.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list | grep -q \"$${OLLAMA_LLM_MODEL%%:*}\" && ollama list | grep -q \"$${OLLAMA_EMBED_MODEL%%:*}\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 240 # allow up to ~1h for the first model download
      start_period: 30s
    restart: unless-stopped
    # ── Uncomment to use an NVIDIA GPU (requires nvidia-container-toolkit) ──
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─────────────────────────────── FastAPI backend ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Container-network overrides (take precedence over .env).
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /app/chroma_db
      DOCUMENT_STORE_DIR: /app/document_store
      WATCHFILES_FORCE_POLLING: "true" # reliable hot reload on Docker Desktop bind mounts
    volumes:
      - ./backend:/app # hot reload of source code
      - ./backend/chroma_db:/app/chroma_db # vector store persistence
      - ./backend/document_store:/app/document_store # original files + sentence offsets
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ──────────────────────────────── React frontend ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:8000 # Vite dev-server proxies /api → backend
      CHOKIDAR_USEPOLLING: "true" # reliable hot reload on Docker Desktop bind mounts
    volumes:
      - ./frontend:/app # hot reload of source code
      - /app/node_modules # keep the container's node_modules
    restart: unless-stopped

volumes:
  ollama_data:
